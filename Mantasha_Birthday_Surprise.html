<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mantasha my love 🎂</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#16001f,#4b126b,#ff4f9a);
  color:white; display:flex; align-items:center; justify-content:center;
}
.stars span{position:absolute;width:4px;height:4px;background:white;border-radius:50%;opacity:.8;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.4)}}
.card{
  width:min(92%,650px); padding:42px 28px; text-align:center;
  border:1px solid rgba(255,255,255,.3); border-radius:28px;
  background:rgba(255,255,255,.12); backdrop-filter:blur(12px);
  box-shadow:0 20px 70px rgba(0,0,0,.35); position:relative; z-index:2;
}
h1{font-size:clamp(38px,8vw,68px);margin:5px 0 10px}
.name{color:#ffd1eb;text-shadow:0 0 20px #ff77b9}
.cake{font-size:76px;animation:bounce 1.5s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.message{font-size:18px;line-height:1.7;max-width:520px;margin:18px auto;color:#ffeef8}
button{
  border:0;border-radius:30px;padding:14px 25px;font-size:16px;
  background:white;color:#9b2768;cursor:pointer;font-weight:bold;
}
#secret{display:none;margin-top:20px;font-size:17px;color:#fff1f8}
.heart{position:fixed;bottom:-30px;font-size:24px;animation:float 5s linear infinite;z-index:1}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="stars">
  <span style="left:8%;top:15%"></span><span style="left:20%;top:70%"></span>
  <span style="left:35%;top:22%"></span><span style="left:65%;top:12%"></span>
  <span style="left:82%;top:30%"></span><span style="left:90%;top:75%"></span>
</div>

<div class="card">
  <div class="cake">🎂</div>
  <div style="font-size:20px">A little birthday surprise for</div>
  <h1><span class="name">Mantasha</span> ✨</h1>
  <p class="message">
  
<br Happy Birthday, Mantasha, My Love. 

I honestly don’t know if words will ever be enough to explain how much you mean to me. I love you more than I can ever put into words—more than “a lot,” more than “so much,” more than I could ever explain.

You have become such a beautiful and special part of my life. Your smile, your presence, and even the smallest moments with you mean more to me than you probably realize.

On your birthday, I just want you to know one thing: I love you so, so, so much. ❤️ And no matter how many times I say it, it will never feel like enough.

I hope your life is always filled with happiness, beautiful moments, and reasons to smile. You deserve all the good things in the world.

Happy Birthday once again, Mantasha. 🎂✨
You will always have a very special place in my heart. ❤️
. 💫
  </p>
  <button onclick="showSecret()">Click for a little surprise 💌</button>
  <div id="secret">
    Some people make ordinary days feel a little more special.<br>
    I hope this birthday becomes one of your happiest memories. 🌷❤️❤️❤️
  </div>
</div>

<script>
function showSecret(){
  document.getElementById("secret").style.display="block";
  for(let i=0;i<18;i++){
    const h=document.createElement("div");
    h.className="heart"; h.textContent=["💗","💖","💕","✨"][i%9];
    h.style.left=Math.random()*100+"vw";
    h.style.animationDelay=(Math.random()*1.5)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }
}
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fireworks 🎆</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050014;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            position: fixed;
            inset: 0;
        }

        .message {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 2;
            pointer-events: none;
        }

        .message h1 {
            font-size: 45px;
            text-shadow:
                0 0 10px #fff,
                0 0 25px #ff4fd8,
                0 0 45px #8b5cff;
        }

        .message p {
            margin-top: 12px;
            font-size: 20px;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .message h1 {
                font-size: 30px;
            }

            .message p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="message">
    <h1>Happy Birthday Mantasha 🎂❤️</h1>
    <p>May your life always shine like these fireworks ✨</p>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let w, h;
let fireworks = [];
let particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

class Firework {

    constructor() {
        this.x = Math.random() * w;
        this.y = h;
        this.targetY = Math.random() * h * 0.5 + 50;
        this.speed = 6 + Math.random() * 3;
        this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
    }

    update() {
        this.y -= this.speed;

        if (this.y <= this.targetY) {
            explode(this.x, this.y, this.color);
            return true;
        }

        return false;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

class Particle {

    constructor(x, y, color) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.alpha = 1;
        this.color = color;
        this.gravity = 0.08;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vy += this.gravity;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.alpha -= 0.015;

        return this.alpha <= 0;
    }

    draw() {
        ctx.save();

        ctx.globalAlpha = this.alpha;
        ctx.beginPath();

        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);

        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        ctx.fill();

        ctx.restore();
    }
}

function explode(x, y, color) {

    for (let i = 0; i < 80; i++) {
        particles.push(
            new Particle(x, y, color)
        );
    }
}

function animate() {

    ctx.fillStyle = "rgba(5, 0, 20, 0.2)";
    ctx.fillRect(0, 0, w, h);

    if (Math.random() < 0.04) {
        fireworks.push(new Firework());
    }

    fireworks = fireworks.filter(firework => {

        firework.draw();

        return !firework.update();

    });

    particles = particles.filter(particle => {

        particle.draw();

        return !particle.update();

    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
